<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Camille in New York - Legal</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif;
            background: #f5f5f7;
            color: #1d1d1f;
            line-height: 1.7;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .card {
            text-align: center;
            background: white;
            border-radius: 24px;
            padding: 48px 40px;
            max-width: 400px;
            margin: 20px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.08);
        }
        .card img {
            width: 96px;
            height: 96px;
            border-radius: 22px;
            margin-bottom: 20px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.15);
        }
        .card h1 {
            font-size: 1.5em;
            font-weight: 800;
            margin-bottom: 4px;
            color: #1d1d1f;
        }
        .card p {
            color: #86868b;
            font-size: 0.95em;
            margin-bottom: 28px;
        }
        .links a {
            display: block;
            padding: 14px 24px;
            margin-bottom: 12px;
            background: linear-gradient(135deg, #132448 0%, #C8102E 100%);
            color: white;
            text-decoration: none;
            border-radius: 12px;
            font-weight: 600;
            font-size: 1em;
            transition: transform 0.2s;
        }
        .links a:hover { transform: scale(1.03); }
        .links a:last-child { margin-bottom: 0; }
    </style>
</head>
<body>
    <div class="card">
        <img src="images/appicon.png" alt="Camille in New York">
        <h1>Camille in New York</h1>
        <p>A bedtime adventure in New York</p>
        <div class="links">
            <a href="privacy.html">Privacy Policy</a>
            <a href="terms.html">Terms of Use</a>
        </div>
    </div>
</body>
</html>
